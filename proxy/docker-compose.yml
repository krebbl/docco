services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    profiles: ["proxy"]
    networks:
      - nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - letsencrypt-certs:/etc/nginx/certs
      - letsencrypt-vhost-d:/etc/nginx/vhost.d
      - letsencrypt-html:/usr/share/nginx/html
  letsencrypt-proxy:
    image: nginxproxy/acme-companion
    container_name: letsencrypt-proxy
    profiles: ["proxy"]
    networks:
      - nginx-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt-certs:/etc/nginx/certs
      - letsencrypt-vhost-d:/etc/nginx/vhost.d
      - letsencrypt-html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=${ACME_DEFAULT_EMAIL:-}
      - NGINX_PROXY_CONTAINER=nginx-proxy
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    privileged: true
    networks:
      - docker-proxy
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # only what lib/apps.rb needs: docker-compose up --build / down -v
      - POST=1        # also gates DELETE (down -v)
      - BUILD=1
      - SESSION=1     # buildkit
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1
  docco:
    image: krebbl/docco
    networks:
      - docker-proxy
    ports:
      - "2222:22"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0
    logging: *default-logging
    volumes:
      - ./authorized_keys:/home/docco/.ssh/authorized_keys:ro
      - docco-git:/git
      - docco-apps:/home/docco/apps

networks:
  nginx-proxy:
    external: true
    name: nginx-proxy
  docker-proxy:
    internal: true

volumes:
  letsencrypt-certs:
  letsencrypt-vhost-d:
  letsencrypt-html:
  acme:
  docco-git:
  docco-apps:
